name: Deploy portfolio to Cloudflare Pages

on:
  push:
    branches:
      - master
    paths:
      - "siva_portfolio/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siva_portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: siva_portfolio

      - name: Run unit tests
        run: npm test -- --run
        working-directory: siva_portfolio

      - name: Build portfolio
        run: npm run build
        working-directory: siva_portfolio

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=siva-portfolio --branch=master
          workingDirectory: siva_portfolio
