name: Deploy portfolio to Cloudflare Workers

on:
  push:
    branches:
      - master
    paths:
      - "siva_portfolio/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siva_portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: siva_portfolio

      - name: Run Vitest
        run: npm run test:ci
        working-directory: siva_portfolio

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome
        working-directory: siva_portfolio

      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: siva_portfolio

      - name: Build portfolio
        run: npm run build
        working-directory: siva_portfolio

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            siva_portfolio/playwright-report/
            siva_portfolio/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository Actions secret."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository Actions secret."
            exit 1
          fi

      - name: Deploy to Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: siva_portfolio
          wranglerVersion: "4"
